name: Build and regression checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Build release executable
        run: swift build -c release --build-system native
      - name: Run regression checks
        run: .build/release/Silicon --self-test
      - name: Package the app
        run: ./scripts/build-app.sh
